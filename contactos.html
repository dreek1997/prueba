<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto - BMX Store</title>
  <link rel="icon" href="imagenes/logo2.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="background-color: rgb(224, 217, 217);">
  <header class="text-center" style="background-image: url(imagenes/fondo_carrusel.png);">
    <a href="index.html">
      <img src="imagenes/logo2.png" alt="Logo" class="img-fluid d-block mx-auto my-3"
        style="max-height: 130px; border-radius: 5%;">
    </a>
    <nav class="nav justify-content-center bg-dark py-3 rounded">
      <a class="btn btn-dark mx-2" href="index.html">Inicio</a>
      <a class="btn btn-dark mx-2" href="somos.html">Quienes somos</a>
      <a class="btn btn-dark mx-2" href="contactos.html">Contacto</a>
    </nav>
  </header>

  <div class="contenido">
    <div class="container my-5">
      <h2 class="text-center indie-flower-regular mb-4">Formulario de contacto</h2>
      <form id="form-contacto">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@ejemplo.com" required>
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."
            required></textarea>
        </div>
        <button type="submit" class="btn btn-dark">Enviar</button>
      </form>
    </div>

    <footer class="text-center py-3 bg-dark text-light mt-4">
      <div class="indie-flower-regular mb-2">© Todos los derechos reservados</div>
      <div class="social-icons d-flex justify-content-center gap-3 flex-wrap">
        <a href="https://www.facebook.com" target="_blank" class="text-light"><i class="fab fa-facebook fa-2x"></i></a>
        <a href="https://www.instagram.com" target="_blank" class="text-light"><i
            class="fab fa-instagram fa-2x"></i></a>
        <a href="https://www.youtube.com" target="_blank" class="text-light"><i class="fab fa-youtube fa-2x"></i></a>
      </div>
    </footer>

    <!-- Modal de éxito -->
    <div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="modalExitoLabel">Mensaje enviado</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
              aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            ¡Tu mensaje fue enviado exitosamente!
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>

    <script>
      const form = document.getElementById("form-contacto");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
          const res = await fetch("https://backend-bmx.onrender.com/guardar_contacto", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          if (res.ok) {
            const modalElement = document.getElementById("modalExito");
            const modal = new bootstrap.Modal(modalElement);
            modal.show();
            form.reset();
            setTimeout(() => {
              window.location.href = "index.html";
            }, 2000);
          } else {
            alert("Error al enviar el mensaje.");
          }
        } catch (err) {
          console.error(err);
          alert("Error de conexión con el servidor.");
        }
      });
    </script>

    <script>
      const contenido = document.querySelector('.contenido');
      document.querySelectorAll("a").forEach(link => {
        if (link.href && !link.href.startsWith("#") && link.target !== "_blank") {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            contenido.classList.add("fade-out");
            setTimeout(() => {
              window.location.href = link.href;
            }, 500);
          });
        }
      });
    </script>
  </div>
</body>

</html>
